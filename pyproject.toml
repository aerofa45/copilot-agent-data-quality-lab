[project]
name = "copilot-agent-data-quality-lab"
version = "0.1.0"
description = "Copilot Studio AI agent reliability and data quality portfolio project"
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
    "email-validator>=2.2.0",
    "fastapi>=0.116.1",
    "httpx>=0.28.1",
    "pandas>=2.3.2",
    "pydantic>=2.11.9",
    "pytest>=8.4.2",
    "uvicorn[standard]>=0.35.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
