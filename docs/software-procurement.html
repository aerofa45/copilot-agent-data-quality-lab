<h1>Software Procurement Policy</h1>
<p>Software purchases require manager approval and IT security review.</p>
<p>Employees should not install unapproved software on managed devices.</p>
<p>The IT Service Desk can create a procurement request but cannot approve it.</p>
</body></html>
